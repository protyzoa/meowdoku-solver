<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowdoku Solver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0ebe3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  h1 { font-size: 2rem; color: #3d2c1e; margin-bottom: 0.25rem; }
  .subtitle { color: #7c6a58; margin-bottom: 2rem; font-size: 0.95rem; }

  .card {
    background: white;
    border-radius: 20px;
    padding: 1.8rem;
    width: 100%;
    max-width: 660px;
    box-shadow: 0 8px 32px rgba(61,44,30,.1);
    margin-bottom: 1.5rem;
  }

  /* ── Drop zone ── */
  .drop-zone {
    border: 2.5px dashed #f4a45a;
    border-radius: 14px;
    padding: 2.2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    color: #a07850;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    background: #fff7ef; border-color: #e07820;
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .drop-zone .icon { font-size: 2.6rem; display: block; margin-bottom: 0.4rem; }
  .drop-zone p { font-size: 0.9rem; }
  .drop-zone strong { color: #e07820; }

  /* ── Preview ── */
  #preview-container { margin-top: 1rem; display: none; position: relative; }
  #preview-container img { width: 100%; border-radius: 10px; border: 2px solid #f4a45a; }
  #preview-container .clear-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.5); color: white;
    border: none; border-radius: 50%;
    width: 28px; height: 28px; font-size: .9rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* ── Options ── */
  .options {
    margin-top: 1.1rem; display: flex; gap: 1rem;
    flex-wrap: wrap; align-items: center;
  }
  .options label { font-size: .85rem; color: #6b5740; display: flex; align-items: center; gap: .3rem; }
  .options input[type="number"] {
    width: 65px; padding: .3rem .5rem;
    border: 1.5px solid #ddd; border-radius: 8px; font-size: .9rem;
  }

  /* ── Solve button ── */
  #solve-btn {
    margin-top: 1.4rem; width: 100%;
    padding: .8rem;
    background: linear-gradient(135deg, #f4a45a, #e07820);
    color: white; border: none; border-radius: 12px;
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  #solve-btn:hover { opacity: .92; }
  #solve-btn:active { transform: scale(.98); }
  #solve-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Error ── */
  .error-box {
    background: #fff0f0; border: 1.5px solid #f4a4a4;
    border-radius: 10px; padding: 1rem;
    color: #8b2020; font-size: .88rem;
    margin-top: 1rem; display: none;
  }

  /* ── Detect info badge ── */
  .detect-badge {
    display: inline-flex; align-items: center; gap: .4rem;
    background: #f0f7ff; border: 1px solid #b0d0f0;
    border-radius: 8px; padding: .35rem .7rem;
    font-size: .8rem; color: #2060a0;
    margin-bottom: 1rem;
  }

  /* ── Side-by-side preview ── */
  .image-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .image-row figure { margin: 0; }
  .image-row figcaption {
    font-size: .75rem; color: #8b7060;
    text-align: center; margin-top: .3rem;
  }
  .image-row img { width: 100%; border-radius: 10px; border: 1.5px solid #ddd; }

  /* ── Full-width result image ── */
  .result-image-full {
    width: 100%; border-radius: 12px;
    border: 2px solid #d4b896; margin-bottom: 1rem;
  }

  /* ── Position badges ── */
  .positions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: .45rem; margin-bottom: 1.2rem;
  }
  .position-badge {
    background: #fff3e8; border: 1.5px solid #f4a45a;
    border-radius: 8px; padding: .35rem .5rem;
    text-align: center; font-size: .78rem; color: #6b4820;
  }

  /* ── ASCII board ── */
  .ascii-board {
    background: #1e1e1e; color: #d4d4d4;
    border-radius: 10px; padding: .9rem;
    font-family: "Cascadia Code","Fira Code","Consolas",monospace;
    font-size: .72rem; overflow-x: auto; white-space: pre; line-height: 1.4;
  }

  summary { cursor: pointer; color: #8b6040; font-size: .88rem; margin-bottom: .5rem; user-select: none; }

  #result-section { display: none; }
  #result-section h2 { color: #3d2c1e; margin-bottom: 1rem; font-size: 1.2rem; }
</style>
</head>
<body>

<h1>Meowdoku Solver</h1>
<p class="subtitle">Upload a screenshot — board and grid size are detected automatically</p>

<div class="card">
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <span class="icon">📷</span>
    <p><strong>Click to upload</strong> or drag & drop a screenshot</p>
    <p style="margin-top:.3rem;font-size:.78rem;">PNG / JPG / WEBP · mobile or desktop screenshot · max 16 MB</p>
  </div>

  <div id="preview-container">
    <img id="preview-img" src="" alt="Preview">
    <button class="clear-btn" id="clear-btn" title="Remove">✕</button>
  </div>

  <div class="options">
    <label>
      Grid size override (leave blank = auto):
      <input type="number" id="grid-size" min="4" max="14" placeholder="auto">
    </label>
    <label>
      <input type="checkbox" id="use-3x3"> 3×3 blocks
    </label>
  </div>

  <button id="solve-btn" disabled>🔍 Solve Puzzle</button>
  <div class="error-box" id="error-box"></div>
</div>

<div class="card" id="result-section">
  <h2>✅ Solution</h2>

  <!-- Detection info -->
  <div class="detect-badge" id="detect-badge">
    <span>🔎</span><span id="detect-info-text">—</span>
  </div>

  <!-- Side-by-side: cropped board vs annotated -->
  <div class="image-row">
    <figure>
      <img id="board-preview-img" src="" alt="Detected board">
      <figcaption>Detected board</figcaption>
    </figure>
    <figure>
      <img id="result-img" src="" alt="Solution">
      <figcaption>Solution</figcaption>
    </figure>
  </div>

  <p style="margin-bottom:.6rem;color:#6b5740;font-size:.88rem;">Cat positions (1-indexed):</p>
  <div class="positions-grid" id="positions-grid"></div>

  <details>
    <summary>Show ASCII board</summary>
    <pre class="ascii-board" id="ascii-board"></pre>
  </details>
</div>

<script>
const dropZone   = document.getElementById("drop-zone");
const fileInput  = document.getElementById("file-input");
const previewC   = document.getElementById("preview-container");
const previewImg = document.getElementById("preview-img");
const clearBtn   = document.getElementById("clear-btn");
const solveBtn   = document.getElementById("solve-btn");
const errorBox   = document.getElementById("error-box");
const resultSec  = document.getElementById("result-section");

let selectedFile = null;

function setFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    previewImg.src = e.target.result;
    previewC.style.display = "block";
    solveBtn.disabled = false;
    errorBox.style.display = "none";
    resultSec.style.display = "none";
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", ()  => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault(); dropZone.classList.remove("dragover");
  setFile(e.dataTransfer.files[0]);
});

clearBtn.addEventListener("click", () => {
  selectedFile = null;
  fileInput.value = "";
  previewC.style.display = "none";
  solveBtn.disabled = true;
  resultSec.style.display = "none";
  errorBox.style.display = "none";
});

solveBtn.addEventListener("click", async () => {
  if (!selectedFile) return;

  solveBtn.disabled = true;
  solveBtn.textContent = "⏳ Solving…";
  errorBox.style.display = "none";
  resultSec.style.display = "none";

  const formData = new FormData();
  formData.append("image", selectedFile);
  const gs = document.getElementById("grid-size").value.trim();
  if (gs) formData.append("grid_size", gs);
  formData.append("use_3x3", document.getElementById("use-3x3").checked ? "true" : "false");

  try {
    const resp = await fetch("/solve", { method: "POST", body: formData });
    const data = await resp.json();

    // Always show board preview if available
    if (data.board_preview) {
      document.getElementById("board-preview-img").src = data.board_preview;
    }
    if (data.grid_size) {
      document.getElementById("detect-info-text").textContent =
        `Auto-detected: ${data.grid_size}×${data.grid_size} board`;
    }

    if (!data.success) {
      showError(data.error || "Unknown error");
      // Still show result section so user sees the board preview
      if (data.board_preview) {
        document.getElementById("result-img").src = data.board_preview;
        resultSec.style.display = "block";
      }
      return;
    }

    document.getElementById("result-img").src = data.annotated_image;

    const grid = document.getElementById("positions-grid");
    grid.innerHTML = data.solution
      .map(([r, c]) => `<div class="position-badge">Row ${r}<br>Col ${c}</div>`)
      .join("");

    document.getElementById("ascii-board").textContent = data.ascii_board;
    resultSec.style.display = "block";
    resultSec.scrollIntoView({ behavior: "smooth" });

  } catch (err) {
    showError("Network error: " + err.message);
  } finally {
    solveBtn.disabled = false;
    solveBtn.textContent = "🔍 Solve Puzzle";
  }
});

function showError(msg) {
  errorBox.textContent = "❌ " + msg;
  errorBox.style.display = "block";
}
</script>
</body>
</html>
